<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ không theo tỷ lệ: xe mình hướng đầu sang phải, đã qua đoạn vạch đứt vào lối ra. Mũi tên xanh đi thẳng trong làn chính tới lối ra phù hợp tiếp theo. Nét đỏ cắt qua vạch liền và vùng gạch chéo sang nhánh ra bị dấu X đỏ cấm, không phải hướng nên đi. Không lùi, quay đầu, dừng để quay lại hoặc dùng làn dừng khẩn cấp hay lề đường; nếu đã vào đường nhánh thì tiếp tục theo biển, không cắt ngược về làn chính.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="180" rx="0" fill="#1a2622"/><g id="exit-main-road"><rect x="0" y="34" width="320" height="88" rx="0" fill="#2c403a"/></g><g id="exit-deceleration-lane"><path d="M32 122L206 122L320 142L320 174L206 166L88 166Z" fill="#2c403a"/></g><path d="M0 34L320 34" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><g id="exit-main-divider"><path d="M0 78L320 78" stroke="#c8dbd1" stroke-width="1.8" stroke-dasharray="12 10" stroke-linecap="round"/></g><g id="exit-entry-boundary"><path d="M32 122L194 122" stroke="#c8dbd1" stroke-width="1.8" stroke-dasharray="8 6" stroke-linecap="round"/></g><g id="exit-solid-separation"><path d="M194 122L320 122" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M206 122L320 142" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="exit-gore"><path d="M206 122L320 122L320 142Z" fill="#1a2622"/><path d="M228 123L238 126" stroke="#c8dbd1" stroke-width="1.4" stroke-linecap="round"/><path d="M252 123L274 133" stroke="#c8dbd1" stroke-width="1.4" stroke-linecap="round"/><path d="M282 123L309 139" stroke="#c8dbd1" stroke-width="1.4" stroke-linecap="round"/></g><g id="exit-outer-edge"><path d="M0 122L32 122L88 166L206 166L320 174" fill="none" stroke="#c8dbd1" stroke-width="2"/></g><text x="16" y="20" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="start">QUÁ MUỘN: ĐI TIẾP</text><text x="16" y="58" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">CHIỀU ĐI</text><g id="exit-traffic-direction"><path d="M94 55L140 55" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/><path d="M248 55L294 55" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><g id="exit-branch-direction"><path d="M246 149L298 155" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><text x="274" y="168" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="middle">NHÁNH RA</text><g id="exit-ego-car"><g transform="translate(222 100) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#b7f36b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="exit-safe-continuation"><path d="M240 100L302 100" fill="none" stroke="#b7f36b" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#tip)"/></g><g id="exit-forbidden-path"><path d="M240 104L284 148" fill="none" stroke="#ff8a6b" stroke-width="2.4" stroke-dasharray="4 4"/></g><g id="exit-prohibition"><path d="M258 122L274 138" stroke="#ff8a6b" stroke-width="3" stroke-linecap="round"/><path d="M274 122L258 138" stroke="#ff8a6b" stroke-width="3" stroke-linecap="round"/></g><text x="124" y="101" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">GIỮ LÀN</text><text x="142" y="149" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ff8a6b" text-anchor="middle">KHÔNG CẮT</text><rect x="0" y="184" width="320" height="16" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Lỡ lối ra: giữ làn, đi tiếp.</text></svg>
