<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ, cùng góc tường: xe có gương mở đang dừng khi đầu hướng chéo lên phải, thân chưa chạm tường. Nét đỏ đứt dự báo bánh sau phải nếu cố tiến theo cung quay hiện tại, giao chân tường tại dấu X; không phải lệnh đi hay đường lùi. Chưa rõ khoảng hở thì giữ xe, quan sát lại và gọi hỗ trợ; không tự lùi ở góc khuất.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><defs><marker id="corner-rear-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#ffc66d"/></marker></defs><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><rect x="76" y="20" width="244" height="88" rx="0" fill="#2c403a"/><rect x="76" y="108" width="118" height="66" rx="0" fill="#2c403a"/><g id="corner-inner-wall"><rect x="194" y="108" width="126" height="66" rx="0" fill="#1a2622"/></g><g id="corner-boundaries"><path d="M76 20L320 20" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M76 20L76 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M194 108L320 108" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M194 108L194 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><text x="10" y="13" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">VÍ DỤ RẼ PHẢI</text><text x="254" y="39" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">LỐI RA →</text><path id="corner-rear-track" d="M178.1 122.1L179.4 120.8L180.8 119.5L182.2 118.3L183.7 117L185.2 115.9L186.7 114.8L188.2 113.7L189.8 112.6L191.4 111.6L193 110.6L194.6 109.7L196.3 108.8L198 108L199.7 107.2L201.4 106.5L203.2 105.8L205 105.1L206.8 104.5L208.6 104L210.4 103.5L212.2 103L214 102.6L215.9 102.2L217.7 101.9L219.6 101.6L221.5 101.4L223.4 101.2L225.2 101.1L227.1 101L229 101" fill="none" stroke="#ff8a6b" stroke-width="2" stroke-dasharray="2 3"/><g id="corner-car" transform="translate(171 115) rotate(45)"><g transform="translate(0 -14) rotate(0)"><rect x="-10" y="-23" width="20" height="46" rx="6" fill="#b7f36b"/><rect x="-6" y="-17" width="12" height="9.2" rx="2" fill="#0e1715" opacity=".45"/><rect x="-6" y="10" width="12" height="7.4" rx="2" fill="#0e1715" opacity=".25"/></g><g id="corner-open-mirrors"><rect x="-14" y="-28" width="4" height="3" rx="1" fill="#b7f36b"/><rect x="10" y="-28" width="4" height="3" rx="1" fill="#b7f36b"/></g><g id="corner-wheels"><g transform="translate(-10 -28) rotate(16.9)"><rect x="-1.5" y="-3" width="3" height="6" rx="1" fill="#c8dbd1"/></g><rect x="-11.5" y="-3" width="3" height="6" rx="1" fill="#c8dbd1"/><g transform="translate(10 -28) rotate(21.3)"><rect x="-1.5" y="-3" width="3" height="6" rx="1" fill="#c8dbd1"/></g><rect x="8.5" y="-3" width="3" height="6" rx="1" fill="#c8dbd1"/></g></g><g id="corner-contact-risk"><path d="M190 106.1L198 114.1" stroke="#ff8a6b" stroke-width="2" stroke-linecap="round"/><path d="M190 114.1L198 106.1" stroke="#ff8a6b" stroke-width="2" stroke-linecap="round"/></g><text x="82" y="146" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">XE DỪNG</text><path d="M124 138L155 125" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><text x="186" y="78" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><text x="124" y="127" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐUÔI</text><text x="224" y="139" font-family