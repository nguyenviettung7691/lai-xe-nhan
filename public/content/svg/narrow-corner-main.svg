<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: xe con có gương mở, đầu hướng lên rồi tiến rẽ phải trong lối hình chữ L. Vệt xanh có mũi tên là bánh trước phải, vệt vàng có mũi tên là bánh sau phải của cùng xe; bánh sau đi phía trong. Chỉ minh họa một đoạn cung quay, không phải toàn bộ vùng quét thân, gương, đầu đuôi xe, mốc đánh lái hay bảo đảm xe thực tế quay lọt.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><defs><marker id="corner-rear-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#ffc66d"/></marker></defs><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><rect x="76" y="20" width="244" height="88" rx="0" fill="#2c403a"/><rect x="76" y="108" width="118" height="66" rx="0" fill="#2c403a"/><g id="corner-inner-wall"><rect x="194" y="108" width="126" height="66" rx="0" fill="#1a2622"/></g><g id="corner-boundaries"><path d="M76 20L320 20" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M76 20L76 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M194 108L320 108" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M194 108L194 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><text x="10" y="13" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">VÍ DỤ RẼ PHẢI</text><text x="254" y="39" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">LỐI RA →</text><path id="corner-front-track" d="M152 114L153.6 110.3L155.3 106.6L157.3 103.1L159.4 99.6L161.7 96.3L164.