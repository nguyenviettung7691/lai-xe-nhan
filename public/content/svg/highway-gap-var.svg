<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: mưa, hai xe cùng làn hướng sang phải; xe mình màu xanh theo sau xe xám, dấu ngoặc từ đầu xe mình đến đuôi xe trước minh họa cự ly tăng, không phải quãng phanh hay số mét. Từ mốc ba giây khô tăng ít nhất sáu giây khi ướt, có thể cần hơn; tuân thủ cự ly lớn hơn biển hoặc bảng trong điều kiện xấu và giảm tốc theo độ bám, tầm nhìn. Sáu giây không bảo đảm an toàn.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="180" rx="0" fill="#1a2622"/><text x="160" y="15" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#a9bcb3" text-anchor="middle">MƯA / ĐƯỜNG ƯỚT</text><g id="gap-rain-cues" stroke="#8fc4e8" stroke-width="1.4" opacity=".7"><path d="M40 24L32 40M112 24L104 40M208 24L200 40M280 24L272 40"/></g><g id="gap-rain-lane"><rect x="0" y="60" width="320" height="44" rx="0" fill="#273e46"/></g><path d="M0 60L320 60" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M0 104L320 104" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><g id="gap-rain-ego"><g transform="translate(48 82) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#b7f36b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="gap-rain-lead"><g transform="translate(272 82) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#7e978c"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="gap-rain-direction"><path d="M68 82L92 82" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/><path d="M292 82L312 82" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><g id="gap-rain-clearance"><path d="M64 122L256 122" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M64 118L64 126" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><path d="M256 118L256 126" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><text x="160" y="115" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">CỰ LY TĂNG</text></g><text x="48" y="54" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">MÌNH</text><text x="272" y="54" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="middle">XE TRƯỚC</text><text x="160" y="133" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#b7f36b" text-anchor="middle">TỪ 3 s KHÔ → ÍT NHẤT 6 s</text><text x="160" y="150" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="middle">CÓ THỂ CẦN HƠN; GIẢM TỐC KHI CẦN</text><rect x="0" y="170" width="320" height="30" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="181" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Vẫn theo biển và cự ly quy</text><text x="16" y="193" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">định; sáu giây không bảo đảm an toàn.</text></svg>
