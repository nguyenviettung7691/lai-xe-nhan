<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Ví dụ riêng nhìn từ trên xuống, không theo tỷ lệ: xe hướng đầu sang phải, còn ở trước biển tối đa 60 km/h, không có biển phụ. Nét dọc mảnh nối vị trí biển với đường chỉ vị trí hiệu lực, không phải vạch đường hay lệnh dừng. Vùng sáng bên phải bắt đầu tại vị trí này: không vượt 60 từ đây, vẫn chậm hơn nếu cần an toàn. Mũi tên đi thẳng khớp đầu xe; giảm tốc êm từ sớm, không có quãng phanh hoặc tốc độ cao tốc chung được bảo đảm.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="180" rx="0" fill="#1a2622"/><text x="12" y="14" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="start">VÍ DỤ RIÊNG: GIỚI HẠN MỚI 60</text><g id="signs-road"><rect x="0" y="76" width="320" height="52" rx="0" fill="#2c403a"/></g><g id="signs-new-limit-region"><rect x="214" y="76" width="106" height="52" rx="0" fill="#b7f36b" opacity="0.08"/></g><path d="M0 76L320 76" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M0 128L320 128" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><g id="signs-new-maximum"><circle cx="214" cy="40" r="18" fill="#fff"/><circle cx="214" cy="40" r="16" fill="none" stroke="#d22" stroke-width="3"/><text x="214" y="45" font-family="DM Mono, ui-monospace, monospace" font-size="15" font-weight="700" fill="#111" text-anchor="middle">60</text></g><g id="signs-effective-position"><path d="M214 58L214 136" stroke="#a9bcb3" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round"/></g><text x="188" y="45" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="end">TỐI ĐA</text><text x="246" y="45" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">km/h</text><g id="signs-car"><g transform="translate(64 102) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#b7f36b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="signs-travel"><path d="M82 102L298 102" fill="none" stroke="#b7f36b" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#tip)"/></g><text x="12" y="148" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">GIẢM ÊM TỪ SỚM</text><text x="266" y="148" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">≤ 60 TỪ BIỂN</text><text x="12" y="164" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">Nét dọc: vị trí biển, không phải vạch đường</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Ví dụ không có biển phụ; không</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">có quãng phanh chung.</text></svg>
