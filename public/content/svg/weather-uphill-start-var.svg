<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn ngang, không theo tỷ lệ, cùng vị trí xe và dốc như hình chính: đầu bên phải hướng lên, đuôi bên trái, cao bên phải và thấp bên trái. Mũi tên đỏ nét đứt nằm hoàn toàn sau đuôi, hướng sang trái và xuống song song dốc, minh họa nguy cơ trôi nếu lực giữ không đủ hoặc hỗ trợ không hoạt động, không phải lệnh lùi hay lỗi chắc chắn do nhả sớm. Nhả ga, đạp phanh chân để dừng và giữ xe; không thêm ga hoặc chọn P, R khi đang trôi.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><text x="16" y="18" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#ff8a6b" text-anchor="start">NGUY CƠ TRÔI: ĐẠP PHANH DỪNG</text><g id="uphill-start-grade"><path d="M30 164L290 60L290 174L30 174Z" fill="#2c403a"/><path d="M30 164L290 60" stroke="#c8dbd1" stroke-width="2.4" stroke-linecap="round"/></g><g id="uphill-start-car" transform="translate(144.1 101.1) rotate(-21.8)"><rect x="-27" y="-11" width="54" height="22" rx="7" fill="#b7f36b"/><path d="M-15 -10L-10 -20L9 -20L19 -10Z" fill="#b7f36b"/><path d="M2 -18L8 -18L14 -11L2 -11Z" fill="#0e1715" opacity=".55"/><rect x="22" y="-6" width="4" height="4" rx="1" fill="#ffc66d"/><circle cx="-15" cy="11" r="5" fill="#0e1715"/><circle cx="15" cy="11" r="5" fill="#0e1715"/></g><text x="42" y="168" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">THẤP</text><text x="278" y="49" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="middle">CAO</text><text x="83" y="83" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐUÔI</text><path d="M109 85L120 100" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><text x="172" y="65" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><path d="M182 69L166 89" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><defs><marker id="uphill-start-rollback-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#ff8a6b"/></marker></defs><g id="uphill-start-rollback"><path d="M105 126L45 150" fill="none" stroke="#ff8a6b" stroke-width="2.4" stroke-dasharray="4 4" marker-end="url(#uphill-start-rollback-tip)"/></g><text x="72" y="113" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ff8a6b" text-anchor="middle">CÓ THỂ TRÔI</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Trôi: nhả ga, phanh chân;</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">không thêm ga.</text></svg>
