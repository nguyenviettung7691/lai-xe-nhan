<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ cắt ngang: mức nước ngập quá nửa bánh xe, cần quay đầu.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="180" rx="0" fill="#1d2a26"/><rect x="0" y="118" width="320" height="62" rx="0" fill="#2c403a"/><rect x="0" y="114" width="320" height="66" rx="0" fill="#3f8fbf" opacity="0.55"/><path d="M0 114q20 -5 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" stroke="#3f8fbf" stroke-width="2" fill="none" opacity=".9"/><g transform="translate(140 120) rotate(0)"><rect x="-27" y="-11" width="54" height="22" rx="7" fill="#ff8a6b"/><rect x="-15" y="-18" width="27" height="9" rx="4" fill="#ff8a6b" opacity=".8"/><circle cx="-15" cy="11" r="5" fill="#0e1715" opacity=".55"/><circle cx="15" cy="11" r="5" fill="#0e1715" opacity=".55"/></g><path d="M246 114L246 178" stroke="#ff8a6b" stroke-width="2" stroke-linecap="round"/><text x="240" y="106" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#ff8a6b" text-anchor="end">Quá nửa bánh xe</text><g stroke="#ff8a6b" stroke-width="3"><path d="M266 128L288 150"/><path d="M288 128L266 150"/></g><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Nước ngập quá nửa bánh thì quay đầu, không thử</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">vượt qua.</text></svg>
