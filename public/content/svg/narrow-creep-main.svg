<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: đầu xe ở trên, đuôi ở dưới, gương nhô hai bên; hai mô tô đang đỗ sát mép phía trước. Mũi tên xanh từ trước đầu xe hướng lên chỉ hướng tiến minh họa, không phải điểm nhìn hay bảo đảm xe lọt. Đi bộ hoặc chậm hơn, chỉ tiến khi quan sát rõ và đủ khoảng hở toàn xe.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><rect x="120" y="0" width="80" height="174" rx="0" fill="#2c403a"/><g id="creep-walls"><path d="M120 0L120 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M200 0L200 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="creep-car"><g transform="translate(160 128) rotate(0)"><rect x="-20" y="-24" width="40" height="48" rx="6" fill="#b7f36b"/><rect x="-16" y="-18" width="32" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-16" y="11" width="32" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><g id="creep-mirrors"><rect x="135" y="110" width="5" height="4" rx="1" fill="#b7f36b"/><rect x="180" y="110" width="5" height="4" rx="1" fill="#b7f36b"/></g></g><text x="220" y="108" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><path d="M182 104L214 104" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><text x="220" y="152" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐUÔI</text><path d="M182 148L214 148" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><g id="creep-parked-bikes"><g transform="translate(128 48) rotate(0)"><rect x="-5" y="-11" width="10" height="22" rx="4" fill="#ffc66d"/><circle cx="0" cy="-13" r="3" fill="#ffc66d" opacity=".7"/></g><g transform="translate(192 48) rotate(0)"><rect x="-5" y="-11" width="10" height="22" rx="4" fill="#ffc66d"/><circle cx="0" cy="-13" r="3" fill="#ffc66d" opacity=".7"/></g></g><text x="14" y="28" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ffc66d" text-anchor="start">MÔ TÔ ĐỖ</text><path d="M80 30L125 39" stroke="#ffc66d" stroke-width="1" stroke-linecap="round"/><text x="220" y="28" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ffc66d" text-anchor="start">MÔ TÔ ĐỖ</text><path d="M216 30L195 39" stroke="#ffc66d" stroke-width="1" stroke-linecap="round"/><g id="creep-forward"><path d="M160 99L160 24" fill="none" stroke="#b7f36b" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#tip)"/></g><text x="14" y="85" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">HƯỚNG TIẾN ↑</text><g><rect x="16" y="156" width="118.4" height="16" rx="8" fill="#b7f36b" opacity=".16"/><text x="22" y="167.5" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="start">Đi bộ hoặc chậm hơn</text></g><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Chỉ tiến khi nhìn rõ và đủ</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">khoảng hở toàn xe.</text></svg>
