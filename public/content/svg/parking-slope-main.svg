<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: phía cao ở trên, thấp ở dưới; đầu xe hướng xuống, đuôi hướng lên. Mũi tên xám bên trái chỉ chiều dốc xuống; mũi tên xanh từ sau đuôi hướng lên vào cửa ô mở chỉ hướng lùi lên dốc, không phải quỹ đạo đánh lái hay mức nhả phanh chung.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><defs><marker id="slope-grade-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#a9bcb3"/></marker><marker id="slope-roll-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#ff8a6b"/></marker></defs><rect x="0" y="0" width="320" height="174" rx="0" fill="#2c403a"/><rect x="120" y="26" width="80" height="60" rx="0" fill="#31463f"/><g id="slope-bay"><path d="M120 26L120 86" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M200 26L200 86" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M120 26L200 26" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/></g><text x="218" y="43" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="start">Ô ĐỖ</text><text x="218" y="55" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">ĐƯỢC PHÉP</text><text x="44" y="34" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">CAO</text><g id="slope-grade"><path d="M44 48L44 134" fill="none" stroke="#a9bcb3" stroke-width="1.8" marker-end="url(#slope-grade-tip)"/></g><text x="44" y="151" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">THẤP</text><text x="60" y="92" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">DỐC</text><text x="60" y="104" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">XUỐNG</text><g id="slope-car"><g transform="translate(160 112) rotate(180)"><rect x="-13" y="-23" width="26" height="46" rx="6" fill="#b7f36b"/><rect x="-9" y="-17" width="18" height="9.2" rx="2" fill="#0e1715" opacity=".45"/><rect x="-9" y="10" width="18" height="7.4" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="184" y="96" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐUÔI</text><text x="184" y="133" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><text x="160" y="13" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">VÍ DỤ LÙI THẲNG LÊN DỐC</text><g id="slope-reverse"><path d="M160 84L160 36" fill="none" stroke="#b7f36b" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#tip)"/></g><text x="218" y="72" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">HƯỚNG LÙI</text><rect x="0" y="170" width="320" height="30" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="181" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ; không có mức nhả phanh chung.</text><text x="16" y="193" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Chỉ lùi khi giữ được xe.</text></svg>
