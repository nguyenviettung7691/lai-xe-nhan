<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ không theo tỷ lệ: xe mình hướng đầu lên, song song lề phải ở bên phải hình, có khoảng hở với lề và cả xe trước, xe sau. Dấu ngoặc chỉ khoảng hở hai đầu, không phải số đo. Mũi tên bên trái chỉ chiều đi; xe đã đỗ không có mũi tên chuyển động.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#2c403a"/><rect x="246" y="0" width="74" height="174" rx="0" fill="#1a2622"/><g id="parallel-curb"><path d="M246 0L246 174" stroke="#c8dbd1" stroke-width="2.4" stroke-linecap="round"/></g><g id="parallel-front"><g transform="translate(226 44) rotate(0)"><rect x="-12" y="-22" width="24" height="44" rx="6" fill="#7e978c"/><rect x="-8" y="-16" width="16" height="8.8" rx="2" fill="#0e1715" opacity=".45"/><rect x="-8" y="9" width="16" height="7" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="parallel-rear"><g transform="translate(226 144) rotate(0)"><rect x="-12" y="-22" width="24" height="44" rx="6" fill="#7e978c"/><rect x="-8" y="-16" width="16" height="8.8" rx="2" fill="#0e1715" opacity=".45"/><rect x="-8" y="9" width="16" height="7" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="260" y="88" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="start">LỀ</text><text x="260" y="102" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="start">PHẢI</text><g id="parallel-traffic"><path d="M44 146L44 120" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><text x="16" y="160" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">CHIỀU ĐI</text><g id="parallel-car"><g transform="translate(226 94) rotate(0)"><rect x="-12" y="-22" width="24" height="44" rx="6" fill="#b7f36b"/><rect x="-8" y="-16" width="16" height="8.8" rx="2" fill="#0e1715" opacity=".45"/><rect x="-8" y="9" width="16" height="7" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="195" y="79" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="end">ĐẦU</text><text x="195" y="113" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="end">ĐUÔI</text><g id="parallel-end-gaps"><path d="M204 66L204 72" stroke="#b7f36b" stroke-width="1.4" stroke-linecap="round"/><path d="M201 66L207 66" stroke="#b7f36b" stroke-width="1.4" stroke-linecap="round"/><path d="M201 72L207 72" stroke="#b7f36b" stroke-width="1.4" stroke-linecap="round"/><path d="M204 116L204 122" stroke="#b7f36b" stroke-width="1.4" stroke-linecap="round"/><path d="M201 116L207 116" stroke="#b7f36b" stroke-width="1.4" stroke-linecap="round"/><path d="M201 122L207 122" stroke="#b7f36b" stroke-width="1.4" stroke-linecap="round"/></g><text x="16" y="48" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">CHỪA CẢ HAI ĐẦU</text><path d="M124 46L204 69" stroke="#8ba79c" stroke-width="1" stroke-linecap="round"/><path d="M124 50L132 119" stroke="#8ba79c" stroke-width="1" stroke-linecap="round"/><path d="M132 119L204 119" stroke="#8ba79c" stroke-width="1" stroke-linecap="round"/><text x="92" y="150" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">SONG SONG, KHÔNG CHẠM LỀ</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ; kiểm tra khoảng hở thực tế.</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Giới hạn sát lề không phải mốc đổi lái.</text></svg>
