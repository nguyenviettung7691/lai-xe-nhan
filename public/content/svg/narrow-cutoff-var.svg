<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ không theo tỷ lệ, cùng ngã ba và vị trí ô tô đang dừng, đầu hướng lên. Xe máy đầu đã sang phải qua miệng ngõ nhưng còn xe đi tiếp từ trái và xe từ hướng đối diện trên phần đường xa hơn. Các mũi tên đỏ nét đứt khớp hướng đầu xe máy; ô tô không có mũi tên chuyển động. Giữ xe, quan sát lại cả hai hướng và người qua đường; không có mốc một thân xe máy hay khoảng trống bảo đảm để đi.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><g id="cutoff-main-road"><rect x="0" y="30" width="320" height="58" rx="0" fill="#2c403a"/></g><g id="cutoff-branch"><rect x="124" y="88" width="80" height="86" rx="0" fill="#2c403a"/></g><g id="cutoff-walls"><path d="M0 30L320 30" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M0 88L124 88" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M204 88L320 88" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M124 88L124 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M204 88L204 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="cutoff-conflict"><rect x="124" y="59" width="80" height="29" rx="0" fill="#ff8a6b" opacity="0.18"/></g><g id="cutoff-ego" transform="translate(176 137) rotate(0)"><g transform="translate(0 0) rotate(0)"><rect x="-13" y="-23" width="26" height="46" rx="6" fill="#b7f36b"/><rect x="-9" y="-17" width="18" height="9.2" rx="2" fill="#0e1715" opacity=".45"/><rect x="-9" y="10" width="18" height="7.4" rx="2" fill="#0e1715" opacity=".25"/></g><g id="cutoff-mirrors"><rect x="-17" y="-14" width="4" height="4" rx="1" fill="#b7f36b"/><rect x="13" y="-14" width="4" height="4" rx="1" fill="#b7f36b"/></g></g><defs><marker id="cutoff-bike-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#ff8a6b"/></marker></defs><g id="cutoff-crossing-bike" transform="translate(260 72) rotate(90)"><g transform="translate(0 0) rotate(0)"><rect x="-5" y="-11" width="10" height="22" rx="4" fill="#ff8a6b"/><circle cx="0" cy="-13" r="3" fill="#ff8a6b" opacity=".7"/></g></g><path id="cutoff-crossing-motion" d="M280 72L304 72" fill="none" stroke="#ff8a6b" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#cutoff-bike-tip)"/><g id="cutoff-following-bike" transform="translate(64 72) rotate(90)"><g transform="translate(0 0) rotate(0)"><rect x="-5" y="-11" width="10" height="22" rx="4" fill="#ff8a6b"/><circle cx="0" cy="-13" r="3" fill="#ff8a6b" opacity=".7"/></g></g><path id="cutoff-following-motion" d="M84 72L224 72" fill="none" stroke="#ff8a6b" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#cutoff-bike-tip)"/><g id="cutoff-opposing-bike" transform="translate(260 44) rotate(270)"><g transform="translate(0 0) rotate(0)"><rect x="-5" y="-11" width="10" height="22" rx="4" fill="#ff8a6b"/><circle cx="0" cy="-13" r="3" fill="#ff8a6b" opacity=".7"/></g></g><path id="cutoff-opposing-motion" d="M240 44L206 44" fill="none" stroke="#ff8a6b" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#cutoff-bike-tip)"/><text x="14" y="111" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ff8a6b" text-anchor="start">XE ĐI TIẾP</text><path d="M68 103L64 82" stroke="#ff8a6b" stroke-width="1" stroke-linecap="round"/><text x="160" y="19" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="middle">ĐƯỜNG CHÍNH: HAI CHIỀU</text><text x="14" y="145" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">NGÕ NHÁNH</text><text x="216" y="117" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU XE</text><path d="M208 114L189 114" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><text x="216" y="145" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">XE DỪNG</text><path d="M210 141L194 141" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><path id="cutoff-legend" d="M16 164L34 164" fill="none" stroke="#ff8a6b" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#cutoff-bike-tip)"/><text x="42" y="167" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ff8a6b" text-anchor="start">HƯỚNG XE MÁY</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Xe vừa qua chưa đủ an toàn;</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">giữ xe, kiểm tra lại cả hai hướng.</text></svg>
