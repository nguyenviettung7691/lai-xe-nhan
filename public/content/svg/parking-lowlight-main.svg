<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: đầu xe hướng xuống lối đi, đuôi hướng lên cửa ô mở. Vệt vàng trước đầu xe minh họa đèn chiếu gần; vệt nhạt sau đuôi minh họa đèn lùi, không phải phạm vi nhìn rõ hay vùng cảm biến. Mũi tên xanh từ sau đuôi hướng thẳng lên ô chỉ một hướng lùi minh họa, không là chỉ dẫn đánh lái cho mọi vị trí.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#14221d"/><rect x="120" y="30" width="80" height="56" rx="0" fill="#253b31"/><g id="lowlight-bay"><path d="M120 86L120 30" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M120 30L200 30" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M200 30L200 86" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/></g><g transform="translate(64 59) rotate(180)"><rect x="-15" y="-24" width="30" height="48" rx="6" fill="#7e978c"/><rect x="-11" y="-18" width="22" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="11" width="22" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><g id="lowlight-car"><g transform="translate(160 112) rotate(180)"><rect x="-15" y="-24" width="30" height="48" rx="6" fill="#b7f36b"/><rect x="-11" y="-18" width="22" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="11" width="22" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="192" y="94" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐUÔI</text><text x="192" y="139" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><text x="16" y="162" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">LỐI ĐI</text><text x="160" y="15" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">CHỈ LÙI KHI THẤY RÕ ĐƯỜNG ĐI</text><g id="lowlight-dipped"><g transform="translate(150 136) rotate(180)" opacity=".28"><path d="M0 0L-9 -25L9 -25Z" fill="#fff2c4"/></g><g transform="translate(170 136) rotate(180)" opacity=".28"><path d="M0 0L-9 -25L9 -25Z" fill="#fff2c4"/></g></g><g id="lowlight-reverse-lamps"><g transform="translate(150 88) rotate(0)" opacity=".28"><path d="M0 0L-6 -24L6 -24Z" fill="#e0f3ff"/></g><g transform="translate(170 88) rotate(0)" opacity=".28"><path d="M0 0L-6 -24L6 -24Z" fill="#e0f3ff"/></g></g><g id="lowlight-reverse"><path d="M160 82L160 44" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><text x="220" y="55" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">LÙI</text><text x="16" y="113" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">Chiếu gần</text><path d="M77 115L144 145" stroke="#a9bcb3" stroke-width="1" stroke-linecap="round"/><text x="220" y="72" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">Đèn lùi</text><path d="M215 74L174 79" stroke="#a9bcb3" stroke-width="1" stroke-linecap="round"/><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Đèn và hướng lùi minh họa, không theo tỷ lệ.</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không bảo đảm vùng nhìn rõ.</text></svg>
