<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Thời điểm sau riêng biệt nhìn từ trên xuống, không theo tỷ lệ: xe mình đã đi hẳn lên trước trong làn trái; xe tải nằm trong làn phải, cả hai hướng đầu sang phải. Mũi tên từ đầu xe mình qua vạch đứt rồi đi thẳng giữa làn phải, không ra lề. Dấu ngoặc hở sau nối theo phương dọc từ đầu xe tải đến đuôi xe mình, không phải số mét, giây hay khoảng cách được bảo đảm. Sơ đồ không chứng minh tầm nhìn trong gương: thấy toàn bộ xe tải trong gương trong chỉ hỗ trợ; còn phải đủ cự ly với xe trước, khoảng hở sau theo tốc độ tương đối, báo hiệu và kiểm tra lại gương, điểm mù phải trước khi về làn.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><g id="overtake-road"><rect x="0" y="42" width="320" height="108" rx="0" fill="#2c403a"/></g><g id="overtake-edges"><path d="M0 42L320 42" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M0 150L320 150" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="overtake-divider"><path d="M0 96L320 96" stroke="#c8dbd1" stroke-width="1.8" stroke-dasharray="10 8" stroke-linecap="round"/></g><text x="16" y="18" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="start">ĐỦ XA MỚI VỀ PHẢI</text><text x="16" y="34" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">HAI LÀN CÙNG CHIỀU</text><g id="overtake-direction"><path d="M260 29L300 29" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/><path d="M260 139L300 139" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><text x="300" y="57" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="end">LÀN TRÁI</text><text x="300" y="111" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="end">LÀN PHẢI</text><g id="overtake-truck"><g transform="translate(76 123) rotate(90)"><rect x="-12" y="-35" width="24" height="15" rx="3" fill="#7e978c"/><rect x="-8" y="-32" width="16" height="3" rx="0" fill="#0e1715"/><rect x="-12" y="-17" width="24" height="52" rx="2" fill="#5f7a70"/></g></g><text x="76" y="126" font-family="DM Mono, ui-monospace, monospace" font-size="7" font-weight="500" fill="#e3ede7" text-anchor="middle">XE TẢI</text><g id="overtake-ego"><g transform="translate(210 69) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#b7f36b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="210" y="54" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">XE MÌNH</text><g id="overtake-return-path"><path d="M226 69C250 69 252 123 278 123L300 123" fill="none" stroke="#b7f36b" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#tip)"/></g><g id="overtake-clearance"><path d="M111 88L194 88" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M111 84L111 92" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><path d="M194 84L194 92" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><text x="152.5" y="81" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">HỞ SAU</text></g><g id="overtake-clearance-guides"><path d="M111 88L111 109" stroke="#b7f36b" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round"/><path d="M194 79L194 88" stroke="#b7f36b" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round"/></g><text x="16" y="163" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">HỞ SAU: ĐẦU XE TẢI ĐẾN ĐUÔI XE MÌNH</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Gương chỉ hỗ trợ; đủ hở, báo</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">hiệu, kiểm tra điểm mù mới về phải.</text></svg>
