<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ không theo tỷ lệ: toàn xe bạn và gương nằm trong chỗ tránh bên phải, đầu hướng lên và đang dừng; xe đối diện hướng xuống với mũi tên cùng chiều. Hai trạng thái không phải quỹ đạo bảo đảm xe lọt.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><g id="yield-road"><rect x="126" y="0" width="64" height="174" rx="0" fill="#2c403a"/></g><g id="yield-pocket"><rect x="190" y="70" width="80" height="88" rx="0" fill="#2c403a"/></g><g id="yield-walls"><path d="M126 0L126 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M190 0L190 70" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M190 158L190 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M190 70L270 70" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M270 70L270 158" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M270 158L190 158" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="yield-ego" transform="translate(230 98) rotate(0)"><g transform="translate(0 0) rotate(0)"><rect x="-15" y="-24" width="30" height="48" rx="6" fill="#b7f36b"/><rect x="-11" y="-18" width="22" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="11" width="22" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><g id="yield-ego-mirrors"><rect x="-19" y="-13" width="4" height="4" rx="1" fill="#b7f36b"/><rect x="15" y="-13" width="4" height="4" rx="1" fill="#b7f36b"/></g></g><g id="yield-other" transform="translate(152 100) rotate(180)"><g transform="translate(0 0) rotate(0)"><rect x="-15" y="-24" width="30" height="48" rx="6" fill="#7e978c"/><rect x="-11" y="-18" width="22" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="11" width="22" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><g id="yield-other-mirrors"><rect x="-19" y="-13" width="4" height="4" rx="1" fill="#7e978c"/><rect x="15" y="-13" width="4" height="4" rx="1" fill="#7e978c"/></g></g><text x="204" y="62" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">CHỖ TRÁNH</text><text x="12" y="24" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">XE ĐỐI DIỆN</text><text x="258" y="78" font-family="DM Mono, ui-monospace, monospace" font-size="7" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><defs><marker id="yield-pass-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#7e978c"/></marker></defs><path id="yield-pass" d="M152 130L152 158" fill="none" stroke="#7e978c" stroke-width="2.4" marker-end="url(#yield-pass-tip)"/><text x="12" y="80" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">XE KIA QUA</text><text x="230" y="138" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">XE BẠN CHỜ</text><text x="230" y="150" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">GIỮ XE</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Giữ xe; chờ cả xe và người qua</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">hết, kiểm tra lại trước khi ra.</text></svg>
