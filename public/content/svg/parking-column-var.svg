<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ, cùng ô và cột bên phải hình: xe đã giữ chắc, nằm trong vạch, đầu ở dưới và đuôi ở trên. Với xe tay lái trái minh họa, cửa lái ở bên phải hình; cung vàng cạnh cột chỉ khoảng quét một cánh cửa trước minh họa, không phải quỹ đạo xe hay khoảng mở bảo đảm. Kiểm tra cả hai bên, khoảng quét cửa thực tế, người xung quanh và lối ra; không chen giữa xe với cột. Không có mũi tên chuyển động.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#2c403a"/><rect x="116" y="28" width="84" height="90" rx="0" fill="#31463f"/><g id="column-bay"><path d="M116 118L116 28" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M116 28L200 28" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M200 28L200 118" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/></g><g id="column-pillar"><rect x="202" y="58" width="22" height="56" rx="2" fill="#7d8f88"/></g><text x="232" y="79" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="start">CỘT</text><g transform="translate(66 74) rotate(180)"><rect x="-14" y="-24" width="28" height="48" rx="6" fill="#7e978c"/><rect x="-10" y="-18" width="20" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-10" y="11" width="20" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><text x="16" y="157" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">LỐI ĐI</text><text x="160" y="14" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">ĐÃ GIỮ XE CHẮC, KIỂM TRA CỬA</text><g id="column-car"><g transform="translate(154 74) rotate(180)"><rect x="-14" y="-24" width="28" height="48" rx="6" fill="#b7f36b"/><rect x="-10" y="-18" width="20" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-10" y="11" width="20" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><g id="column-mirrors"><rect x="137" y="86" width="4" height="3" rx="1" fill="#b7f36b"/><rect x="167" y="86" width="4" height="3" rx="1" fill="#b7f36b"/></g></g><text x="180" y="56" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐUÔI</text><text x="180" y="96" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><g id="column-door"><path d="M168 64A18 18 0 0 1 186 82L168 82Z" fill="#ffc66d" opacity=".25"/><path d="M168 64A18 18 0 0 1 186 82" fill="none" stroke="#ffc66d" stroke-width="1.4" stroke-dasharray="3 3"/><path d="M168 82L186 82" stroke="#ffc66d" stroke-width="2" stroke-linecap="round"/></g><text x="234" y="128" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ffc66d" text-anchor="start">CỬA LÁI</text><text x="234" y="140" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ffc66d" text-anchor="start">MINH HỌA</text><path d="M230 126L186 82" stroke="#ffc66d" stroke-width="1" stroke-linecap="round"/><text x="16" y="131" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">XE TAY LÁI TRÁI</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ; kiểm tra cả khoảng quét cửa và</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">lối ra thực tế, không chen sát cột.</text></svg>
