<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: làn xe đang chạy nằm ngang ở trên; xe mình đã dừng hoàn toàn trong ô điểm dừng được phép phía dưới, cả hai xe hướng đầu sang phải. Mũi tên chỉ chiều xe trên làn chạy, không phải đường tấp vào. Bốn dấu vàng ở các góc xe dừng minh họa đèn cảnh báo khi cần theo quy định, không phải quyền đỗ sai hay yêu cầu luôn bật khi mưa; không vẽ đường chuyển làn, vị trí thực tế cần có lối vào an toàn, không ngập.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><text x="160" y="17" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="700" fill="#b7f36b" text-anchor="middle">VÍ DỤ ĐIỂM DỪNG ĐƯỢC PHÉP</text><g id="rain-live-lane"><rect x="12" y="54" width="296" height="44" rx="0" fill="#2c403a"/><path d="M12 54L308 54" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M12 98L180 98" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><text x="94" y="45" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">LÀN ĐANG CHẠY</text><g id="rain-passing-car"><g transform="translate(75 76) rotate(90)"><rect x="-13" y="-23" width="26" height="46" rx="6" fill="#7e978c"/><rect x="-9" y="-17" width="18" height="9.2" rx="2" fill="#0e1715" opacity=".45"/><rect x="-9" y="10" width="18" height="7.4" rx="2" fill="#0e1715" opacity=".25"/></g></g><rect x="95" y="68" width="3" height="5" rx="1" fill="#fff3b0"/><rect x="95" y="79" width="3" height="5" rx="1" fill="#fff3b0"/><g id="rain-through-direction"><path d="M112 76L154 76" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><g id="rain-permitted-bay"><rect x="180" y="98" width="128" height="66" rx="0" fill="#1a2622"/><path d="M180 98L180 164L308 164L308 98" fill="none" stroke="#c8dbd1" stroke-width="2"/><text x="244" y="111" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="middle">XE ĐÃ DỪNG</text></g><g id="rain-stopped-car"><g transform="translate(244 136) rotate(90)"><rect x="-13" y="-23" width="26" height="46" rx="6" fill="#b7f36b"/><rect x="-9" y="-17" width="18" height="9.2" rx="2" fill="#0e1715" opacity=".45"/><rect x="-9" y="10" width="18" height="7.4" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="rain-hazard-lamps"><rect x="221.5" y="123.5" width="3" height="3" rx="1" fill="#ffc66d"/><rect x="221.5" y="145.5" width="3" height="3" rx="1" fill="#ffc66d"/><rect x="263.5" y="123.5" width="3" height="3" rx="1" fill="#ffc66d"/><rect x="263.5" y="145.5" width="3" height="3" rx="1" fill="#ffc66d"/></g><text x="20" y="119" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#ff8a6b" text-anchor="start">KHÔNG TRÚ MƯA</text><text x="20" y="134" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#ff8a6b" text-anchor="start">TRONG LÀN CHẠY</text><text x="20" y="155" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">Chỉ vào khi có lối an toàn.</text><rect x="0" y="170" width="320" height="30" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="181" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không là làn khẩn cấp; đèn không cho phép đỗ</text><text x="16" y="193" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">sai.</text></svg>
