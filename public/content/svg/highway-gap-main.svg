<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Hai thời điểm nhìn từ trên xuống, không theo tỷ lệ: xe mình màu xanh và xe trước màu xám cùng làn, đầu và mũi tên hướng sang phải. Nét dọc vàng là cùng một mốc cố định bên đường, không phải vạch dừng. Bắt đầu khi đuôi xe trước ngang mốc ở hình trên; kết thúc khi đầu xe mình ngang mốc ở hình dưới. Ít nhất ba giây chỉ là tham khảo khi khô, thuận lợi; vẫn giữ cự ly theo biển, tốc độ và điều kiện. Dấu ngoặc chỉ cự ly giữa hai cản xe, không quy đổi độ dài hình thành giây hay mét.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="180" rx="0" fill="#1a2622"/><text x="12" y="14" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="start">1. ĐUÔI QUA MỐC: BẮT ĐẦU ĐẾM</text><text x="56" y="32" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">MÌNH</text><text x="160" y="32" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ffc66d" text-anchor="middle">MỐC</text><text x="230" y="32" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="middle">XE TRƯỚC</text><g id="gap-start-lane"><rect x="0" y="38" width="320" height="38" rx="0" fill="#2c403a"/></g><path d="M0 38L320 38" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M0 76L320 76" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><g id="gap-start-marker"><path d="M160 38L160 84" stroke="#ffc66d" stroke-width="1.4" stroke-dasharray="2 3" stroke-linecap="round"/></g><g id="gap-start-ego"><g transform="translate(56 57) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#b7f36b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="gap-start-lead"><g transform="translate(176 57) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#7e978c"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="gap-start-direction"><path d="M76 57L100 57" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/><path d="M196 57L216 57" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><g id="gap-start-clearance"><path d="M72 80L160 80" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M72 76L72 84" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><path d="M160 76L160 84" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><text x="116" y="73" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">CỰ LY</text></g><text x="12" y="98" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="start">2. ĐẦU TỚI CÙNG MỐC: ≥ 3 s (KHÔ)</text><g id="gap-end-lane"><rect x="0" y="112" width="320" height="38" rx="0" fill="#2c403a"/></g><path d="M0 112L320 112" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M0 150L320 150" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><g id="gap-end-marker"><path d="M160 112L160 158" stroke="#ffc66d" stroke-width="1.4" stroke-dasharray="2 3" stroke-linecap="round"/></g><g id="gap-end-ego"><g transform="translate(144 131) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#b7f36b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="gap-end-lead"><g transform="translate(264 131) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#7e978c"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="gap-end-direction"><path d="M164 131L188 131" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/><path d="M284 131L304 131" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><g id="gap-end-clearance"><path d="M160 154L248 154" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M160 150L160 158" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><path d="M248 150L248 158" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><text x="204" y="147" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">CỰ LY</text></g><rect x="0" y="170" width="320" height="30" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="181" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Đếm đủ giây; vẫn theo biển,</text><text x="16" y="193" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">tốc độ và điều kiện đường.</text></svg>
