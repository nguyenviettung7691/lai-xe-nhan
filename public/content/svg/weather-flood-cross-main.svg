<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn ngang, không theo tỷ lệ: đầu xe hướng phải, bánh tiếp xúc nền khô; xe đứng yên hoàn toàn trước vạch minh họa không vào, nước che khuất đường ở bên phải. Không có mũi tên đi vào nước, số đo độ sâu hoặc quỹ đạo quay đầu; vạch đỏ không phải biển hay rào thật.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><text x="160" y="18" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="700" fill="#b7f36b" text-anchor="middle">DỪNG TRÊN NỀN KHÔ, KHÔNG VÀO NGẬP</text><g id="flood-unknown-water"><rect x="176" y="56" width="144" height="112" rx="0" fill="#3f8fbf" opacity="0.55"/><path d="M176 56L320 56" stroke="#3f8fbf" stroke-width="2" stroke-linecap="round"/><text x="248" y="80" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#ffffff" text-anchor="middle">ĐƯỜNG BỊ CHE</text><text x="248" y="101" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#ffffff" text-anchor="middle">Độ sâu?</text><text x="248" y="121" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#ffffff" text-anchor="middle">Hố, dòng chảy?</text></g><g id="flood-dry-road"><rect x="12" y="132" width="146" height="36" rx="0" fill="#2c403a"/><path d="M12 132L158 132" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><text x="77" y="153" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="middle">NỀN KHÔ</text></g><g id="flood-stationary-car"><g transform="translate(75 116) rotate(0)"><rect x="-27" y="-11" width="54" height="22" rx="7" fill="#b7f36b"/><rect x="-15" y="-18" width="27" height="9" rx="4" fill="#b7f36b" opacity=".8"/><circle cx="-15" cy="11" r="5" fill="#0e1715" opacity=".55"/><circle cx="15" cy="11" r="5" fill="#0e1715" opacity=".55"/></g></g><rect x="99" y="110" width="3" height="5" rx="1" fill="#fff3b0"/><text x="48" y="84" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="middle">ĐUÔI</text><text x="102" y="84" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">ĐẦU</text><g id="flood-no-entry-boundary"><path d="M158 76L158 160" stroke="#ff8a6b" stroke-width="3" stroke-linecap="round"/><text x="148" y="49" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="700" fill="#ff8a6b" text-anchor="end">KHÔNG VÀO</text></g><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ; không vẽ độ sâu hay chỗ quay</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">đầu.</text></svg>
