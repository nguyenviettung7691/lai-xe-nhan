<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: cột bên phải hình, cạnh cửa ô mở; đầu xe ở dưới, đuôi ở trên. Xe đã thẳng hướng, mũi tên từ sau đuôi hướng lên ô chỉ ví dụ lùi thẳng, không phải hướng đánh lái hay bảo đảm khoảng hở. Phải kiểm tra cả thân, gương, góc xe, hai bên và vùng đầu xe quét; chưa rõ thì dừng, không chờ cảm biến.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#2c403a"/><rect x="116" y="28" width="84" height="90" rx="0" fill="#31463f"/><g id="column-bay"><path d="M116 118L116 28" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M116 28L200 28" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M200 28L200 118" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/></g><g id="column-pillar"><rect x="202" y="58" width="22" height="56" rx="2" fill="#7d8f88"/></g><text x="232" y="79" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="start">CỘT</text><g transform="translate(66 74) rotate(180)"><rect x="-14" y="-24" width="28" height="48" rx="6" fill="#7e978c"/><rect x="-10" y="-18" width="20" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-10" y="11" width="20" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><text x="16" y="157" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">LỐI ĐI</text><text x="160" y="14" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">VÍ DỤ ĐÃ THẲNG HƯỚNG VÀO Ô</text><g id="column-car"><g transform="translate(154 145) rotate(180)"><rect x="-14" y="-24" width="28" height="48" rx="6" fill="#b7f36b"/><rect x="-10" y="-18" width="20" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-10" y="11" width="20" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><g id="column-mirrors"><rect x="137" y="157" width="4" height="3" rx="1" fill="#b7f36b"/><rect x="167" y="157" width="4" height="3" rx="1" fill="#b7f36b"/></g></g><text x="180" y="127" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐUÔI</text><text x="180" y="167" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><g id="column-reverse"><path d="M154 117L154 44" fill="none" stroke="#b7f36b" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#tip)"/></g><text x="16" y="44" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">HƯỚNG LÙI</text><path d="M88 42L149 44" stroke="#8ba79c" stroke-width="1" stroke-linecap="round"/><text x="16" y="111" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">RÕ HAI BÊN</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ; chỉ ví dụ lùi thẳng. Chưa rõ</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">khoảng hở thì dừng, không chờ tiếng báo.</text></svg>
