<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ quy trình ba khung đọc từ trên xuống: giảm tốc theo biển, độ bám và tầm nhìn; chọn mức được phép theo sách xe, không ép số hoặc quá tua; kiểm tra phản hồi, nếu không nhận thì dừng bấm trừ và dùng phanh giảm tốc. Hai mũi tên xanh chỉ thứ tự kiểm tra, không phải hướng xe chạy, quỹ đạo, chuỗi D về 3 rồi 2, mức vòng tua hay thời gian, nhịp đạp phanh.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><text x="16" y="16" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="start">KHÔNG CÓ CHUỖI SỐ CHUNG</text><g id="engine-brake-slow"><rect x="12" y="24" width="296" height="38" rx="6" fill="#2c403a"/><text x="22" y="38" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#b7f36b" text-anchor="start">1. GIẢM TỐC TRƯỚC</text><text x="22" y="52" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">Theo biển, độ bám và tầm nhìn.</text></g><g id="engine-brake-connect-first"><path d="M160 64L160 71" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><g id="engine-brake-select"><rect x="12" y="76" width="296" height="38" rx="6" fill="#2c403a"/><text x="22" y="90" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#b7f36b" text-anchor="start">2. CHỌN MỨC ĐƯỢC PHÉP</text><text x="22" y="104" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">Theo sách xe; không ép số, quá tua.</text></g><g id="engine-brake-connect-second"><path d="M160 116L160 123" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><g id="engine-brake-check"><rect x="12" y="128" width="296" height="38" rx="6" fill="#2c403a"/><text x="22" y="142" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#b7f36b" text-anchor="start">3. KIỂM TRA PHẢN HỒI</text><text x="22" y="156" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">Không nhận: dừng bấm trừ, phanh giảm tốc.</text></g><rect x="0" y="184" width="320" height="16" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Thứ tự kiểm tra, không là cấp số hay nhịp phanh.</text></svg>
