<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ, cùng hướng xe: đầu ở trên, đuôi ở dưới. Xe mình đang dừng trước vùng xung đột tô đỏ, không có mũi tên chuyển động của xe mình. Xe máy hướng sang trái từ lối mở bên phải; mũi tên đỏ nét đứt chỉ hướng xe máy cắt ngang, không phải lệnh đánh lái. Giữ phanh, chờ lối đi rõ và quan sát lại trước khi đi tiếp.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><rect x="120" y="0" width="80" height="174" rx="0" fill="#2c403a"/><g id="creep-walls"><path d="M120 0L120 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><rect x="200" y="42" width="120" height="42" rx="0" fill="#2c403a"/><path d="M200 0L200 42" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M200 84L200 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M200 42L320 42" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M200 84L320 84" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="creep-car"><g transform="translate(160 128) rotate(0)"><rect x="-20" y="-24" width="40" height="48" rx="6" fill="#b7f36b"/><rect x="-16" y="-18" width="32" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-16" y="11" width="32" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><g id="creep-mirrors"><rect x="135" y="110" width="5" height="4" rx="1" fill="#b7f36b"/><rect x="180" y="110" width="5" height="4" rx="1" fill="#b7f36b"/></g></g><text x="220" y="108" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><path d="M182 104L214 104" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><text x="220" y="152" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐUÔI</text><path d="M182 148L214 148" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><defs><marker id="creep-bike-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#ff8a6b"/></marker></defs><g id="creep-conflict"><rect x="136" y="44" width="48" height="38" rx="4" fill="#ff8a6b" opacity="0.18"/></g><g id="creep-crossing-bike"><g transform="translate(238 63) rotate(270)"><rect x="-5" y="-11" width="10" height="22" rx="4" fill="#ff8a6b"/><circle cx="0" cy="-13" r="3" fill="#ff8a6b" opacity=".7"/></g></g><g id="creep-bike-motion"><path d="M220 63L160 63" fill="none" stroke="#ff8a6b" stroke-width="2.4" stroke-dasharray="4 4" marker-end="url(#creep-bike-tip)"/></g><text x="216" y="31" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">LỐI RA NHÁNH</text><text x="14" y="61" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ff8a6b" text-anchor="start">VÙNG XUNG ĐỘT</text><path d="M94 64L133 64" stroke="#ff8a6b" stroke-width="1" stroke-linecap="round"/><text x="14" y="129" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">XE ĐANG DỪNG</text><g><rect x="16" y="156" width="146.4" height="16" rx="8" fill="#b7f36b" opacity=".16"/><text x="22" y="167.5" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="start">Giữ phanh, chờ lối đi rõ</text></g><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Dừng trước vùng xung đột; quan</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">sát lại trước khi đi tiếp.</text></svg>
