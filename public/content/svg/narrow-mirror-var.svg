<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: cùng xe đầu hướng lên, hai gương vẫn mở; xe đang dừng trước đoạn tường trái nhô vào lối đi. Nét đứt đỏ ngang đoạn thắt chỉ khoảng hở chưa rõ, không phải hướng xe chạy hay bằng chứng xe lọt. Không có mũi tên tiến, lùi hoặc gập gương; chỉ đi tiếp sau khi kiểm tra rõ và đủ khoảng hở toàn xe.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><rect x="90" y="0" width="146" height="174" rx="0" fill="#2c403a"/><g id="mirror-walls"><path d="M90 0L90 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M236 0L236 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="mirror-car"><g transform="translate(148 118) rotate(0)"><rect x="-20" y="-32" width="40" height="64" rx="6" fill="#b7f36b"/><rect x="-16" y="-26" width="32" height="12.8" rx="2" fill="#0e1715" opacity=".45"/><rect x="-16" y="19" width="32" height="10.2" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="mirror-open"><rect x="122" y="96" width="6" height="4" rx="1" fill="#b7f36b"/><rect x="168" y="96" width="6" height="4" rx="1" fill="#b7f36b"/></g><text x="148" y="80" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">ĐẦU</text><text x="148" y="162" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">ĐUÔI</text><g id="mirror-obstruction"><rect x="90" y="28" width="43" height="38" rx="2" fill="#7e978c"/></g><g id="mirror-uncertain-gap"><path d="M133 48L236 48" stroke="#ff8a6b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M133 43L133 53" stroke="#ff8a6b" stroke-width="1.6" stroke-linecap="round"/><path d="M236 43L236 53" stroke="#ff8a6b" stroke-width="1.6" stroke-linecap="round"/></g><text x="184" y="40" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ff8a6b" text-anchor="middle">CHƯA RÕ</text><text x="14" y="20" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">TƯỜNG NHÔ</text><path d="M74 23L108 33" stroke="#8ba79c" stroke-width="1" stroke-linecap="round"/><text x="248" y="112" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">XE DỪNG</text><path d="M240 108L178 108" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><text x="14" y="136" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">GƯƠNG MỞ</text><path d="M78 132L123 102" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><rect x="0" y="170" width="320" height="30" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="181" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Chưa rõ khoảng hở thì dừng;</text><text x="16" y="193" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">không gập gương để cố lọt.</text></svg>
