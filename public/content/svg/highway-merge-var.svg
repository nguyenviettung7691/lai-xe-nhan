<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ không theo tỷ lệ: ba xe cùng hướng sang phải trên làn sát bên phải cao tốc; xe mình ở giữa. Hai ngoặc nét đứt đo khoảng hở từ đầu xe sau tới đuôi xe mình và từ đầu xe mình tới đuôi xe trước, không phải mũi tên chuyển động hay mốc giây cố định. Hình không chứng minh khe an toàn; cần xét xe sau đến gần nhanh, không ép xe khác phanh gấp hoặc đánh lái tránh.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="180" rx="0" fill="#1a2622"/><rect x="0" y="30" width="320" height="102" rx="0" fill="#2c403a"/><g id="merge-receiving-lane"><rect x="0" y="80" width="320" height="52" rx="0" fill="#2c403a"/></g><g id="merge-acceleration-lane"><path d="M0 132L300 132L210 174L0 174Z" fill="#2c403a"/></g><path d="M0 30L320 30" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><g id="merge-main-divider"><path d="M0 80L320 80" stroke="#c8dbd1" stroke-width="1.8" stroke-dasharray="12 10" stroke-linecap="round"/></g><g id="merge-solid-separator"><path d="M0 132L80 132" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="merge-entry-boundary"><path d="M80 132L300 132" stroke="#c8dbd1" stroke-width="1.8" stroke-dasharray="8 6" stroke-linecap="round"/></g><g id="merge-outer-edge"><path d="M0 174L210 174L300 132L320 132" fill="none" stroke="#c8dbd1" stroke-width="2"/></g><text x="16" y="20" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="start">NHẬP TỪ BÊN PHẢI</text><text x="16" y="54" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">CHIỀU ĐI</text><g id="merge-traffic-direction"><path d="M94 51L138 51" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/><path d="M250 51L294 51" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><g id="merge-rear-car"><g transform="translate(28 106) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#7e978c"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="merge-front-car"><g transform="translate(278 106) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#7e978c"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="8" y="92" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">XE SAU</text><text x="304" y="92" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="end">XE TRƯỚC</text><g id="merge-ego-car"><g transform="translate(160 106) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#b7f36b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="merge-rear-gap"><path d="M44 123L144 123" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M44 119L44 127" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><path d="M144 119L144 127" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><text x="94" y="116" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">Hở sau</text></g><g id="merge-front-gap"><path d="M176 123L262 123" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M176 119L176 127" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><path d="M262 119L262 127" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><text x="219" y="116" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">Hở trước</text></g><text x="160" y="92" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">XE MÌNH</text><text x="16" y="151" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">XÉT CẢ TỐC ĐỘ XE SAU ĐẾN GẦN</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Khe ba giây không bảo đảm đủ</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">chỗ nhập làn.</text></svg>
