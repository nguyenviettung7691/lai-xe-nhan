<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống: biển giới hạn tốc độ 60 km/h và quãng giảm tốc trước biển.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="180" rx="0" fill="#1a2622"/><rect x="0" y="30" width="320" height="114" rx="0" fill="#2c403a"/><path d="M0 68L320 68" stroke="#c8dbd1" stroke-width="1.8" stroke-dasharray="14 12" stroke-linecap="round"/><path d="M0 106L320 106" stroke="#c8dbd1" stroke-width="1.8" stroke-dasharray="14 12" stroke-linecap="round"/><path d="M0 30L320 30" stroke="#c8dbd1" stroke-width="2.4" stroke-linecap="round"/><path d="M0 144L320 144" stroke="#c8dbd1" stroke-width="2.4" stroke-linecap="round"/><circle cx="78" cy="16" r="13" fill="#f4f6f2"/><circle cx="78" cy="16" r="11" fill="none" stroke="#d33" stroke-width="3"/><text x="78" y="20" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="700" fill="#1b1b1b" text-anchor="middle">60</text><g transform="translate(206 98) rotate(90)"><rect x="-13" y="-23" width="26" height="46" rx="6" fill="#b7f36b"/><rect x="-9" y="-17" width="18" height="9.2" rx="2" fill="#0e1715" opacity=".45"/><rect x="-9" y="10" width="18" height="7.4" rx="2" fill="#0e1715" opacity=".25"/></g><path d="M110 82L190 82" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M110 78L110 86" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><path d="M190 78L190 86" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><text x="150" y="75" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">Giảm tốc trước biển</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Tốc độ đổi theo biển gần nhất, không đi theo trí</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">nhớ.</text></svg>
