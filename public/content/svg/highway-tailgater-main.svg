<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: hai làn cùng chiều sang phải. Xe mình màu xanh ở giữa làn trái, xe sau màu cam bám sát cùng làn, xe trước màu xám ở xa hơn phía trước. Ngoặc cam nối đầu xe sau đến đuôi xe mình là tình huống nguy hiểm, không phải cự ly chuẩn; ngoặc xanh nối đầu xe mình đến đuôi xe trước nhắc tăng khoảng trống phía trước êm theo biển, tốc độ và điều kiện, không phải số mét hay giây bảo đảm. Không phanh cảnh cáo, nhưng vẫn phanh cần thiết khi có nguy hiểm tức thời.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><g id="tailgater-road"><rect x="0" y="42" width="320" height="108" rx="0" fill="#2c403a"/></g><g id="tailgater-edges"><path d="M0 42L320 42" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M0 150L320 150" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="tailgater-divider"><path d="M0 96L320 96" stroke="#c8dbd1" stroke-width="1.8" stroke-dasharray="10 8" stroke-linecap="round"/></g><text x="16" y="18" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="start">BỊ BÁM SÁT: GIÃN TRƯỚC ÊM</text><text x="16" y="34" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">HAI LÀN CÙNG CHIỀU</text><g id="tailgater-direction"><path d="M260 29L300 29" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/><path d="M260 139L300 139" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><g id="tailgater-follower"><g transform="translate(54 69) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#ff8a6b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="tailgater-ego"><g transform="translate(94 69) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#b7f36b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="54" y="53" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ff8a6b" text-anchor="middle">XE SAU</text><text x="110" y="53" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">XE MÌNH</text><text x="16" y="92" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">LÀN TRÁI</text><text x="16" y="127" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">LÀN PHẢI</text><g id="tailgater-lead"><g transform="translate(274 69) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#7e978c"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="274" y="53" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="middle">XE TRƯỚC</text><g id="tailgater-rear-gap"><path d="M70 105L78 105" stroke="#ff8a6b" stroke-width="1.6" stroke-dasharray="2 2" stroke-linecap="round"/><path d="M70 101L70 109" stroke="#ff8a6b" stroke-width="1.6" stroke-linecap="round"/><path d="M78 101L78 109" stroke="#ff8a6b" stroke-width="1.6" stroke-linecap="round"/><text x="86" y="109" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ff8a6b" text-anchor="start">BÁM SÁT</text></g><g id="tailgater-front-gap"><path d="M110 92L258 92" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M110 88L110 96" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><path d="M258 88L258 96" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><text x="184" y="85" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">TĂNG HỞ TRƯỚC ÊM</text></g><text x="160" y="163" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ff8a6b" text-anchor="middle">KHÔNG PHANH CẢNH CÁO</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ; không phải cự ly chuẩn. Vẫn</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">phanh cần thiết khi nguy hiểm tức thời.</text></svg>
