<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ không theo tỷ lệ, cùng hướng xe và cửa ô mở: xe đang dừng, người hỗ trợ đứng bên phải hình, ngoài hành lang lùi thẳng minh họa, không giữa xe và vật cản. Nét đứt nối bên xe với người hỗ trợ chỉ liên lạc trong tầm nhìn, không phải quỹ đạo hay vùng quan sát bảo đảm. Vị trí thực tế phải tránh cả vùng đầu xe quét, luôn nhìn thấy nhau; mất liên lạc thì dừng ngay. Không có mũi tên chuyển động.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#14221d"/><rect x="120" y="30" width="80" height="56" rx="0" fill="#253b31"/><g id="lowlight-bay"><path d="M120 86L120 30" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M120 30L200 30" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M200 30L200 86" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/></g><g transform="translate(64 59) rotate(180)"><rect x="-15" y="-24" width="30" height="48" rx="6" fill="#7e978c"/><rect x="-11" y="-18" width="22" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="11" width="22" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><g id="lowlight-car"><g transform="translate(160 112) rotate(180)"><rect x="-15" y="-24" width="30" height="48" rx="6" fill="#b7f36b"/><rect x="-11" y="-18" width="22" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="11" width="22" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="192" y="94" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐUÔI</text><text x="192" y="139" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><text x="16" y="162" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">LỐI ĐI</text><text x="160" y="15" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">XE DỪNG ĐỂ THỐNG NHẤT TÍN HIỆU</text><g id="lowlight-guide"><circle cx="242" cy="64" r="5" fill="#ffc66d"/><path d="M242 70L242 82" stroke="#ffc66d" stroke-width="3" stroke-linecap="round"/><path d="M235 74L249 74" stroke="#ffc66d" stroke-width="2" stroke-linecap="round"/><path d="M242 82L236 90" stroke="#ffc66d" stroke-width="2" stroke-linecap="round"/><path d="M242 82L248 90" stroke="#ffc66d" stroke-width="2" stroke-linecap="round"/></g><text x="242" y="43" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ffc66d" text-anchor="middle">NGƯỜI HỖ TRỢ</text><g id="lowlight-sight"><path d="M179 116L232 79" stroke="#a9bcb3" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/></g><text x="306" y="158" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="end">XE ĐANG DỪNG</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Nét đứt: liên lạc minh họa, không là quỹ đạo.</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Mất liên lạc thì dừng.</text></svg>
