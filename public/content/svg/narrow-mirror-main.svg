<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: đầu xe hướng lên, đuôi ở dưới, hai gương mở nhô ngoài thân; mô tô đỗ bên phải có tay lái nhô ra. a nối tường trái với mép ngoài gương trái, b nối mép ngoài gương phải với mép gần nhất tay lái tại cùng mặt cắt; không phải số đo, mức hở an toàn chung hay vùng nhìn thấy trong gương. Không có mũi tên chuyển động.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><rect x="90" y="0" width="146" height="174" rx="0" fill="#2c403a"/><g id="mirror-walls"><path d="M90 0L90 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M236 0L236 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="mirror-car"><g transform="translate(148 118) rotate(0)"><rect x="-20" y="-32" width="40" height="64" rx="6" fill="#b7f36b"/><rect x="-16" y="-26" width="32" height="12.8" rx="2" fill="#0e1715" opacity=".45"/><rect x="-16" y="19" width="32" height="10.2" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="mirror-open"><rect x="122" y="96" width="6" height="4" rx="1" fill="#b7f36b"/><rect x="168" y="96" width="6" height="4" rx="1" fill="#b7f36b"/></g><text x="148" y="80" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">ĐẦU</text><text x="148" y="162" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">ĐUÔI</text><g id="mirror-parked-bike"><g transform="translate(218 108) rotate(0)"><g id="mirror-bike-wheels"><rect x="-3" y="-25" width="6" height="12" rx="2" fill="#ffc66d"/><rect x="-3" y="13" width="6" height="12" rx="2" fill="#ffc66d"/></g><rect x="-6" y="-12" width="12" height="26" rx="4" fill="#ffc66d"/><rect x="-4" y="-1" width="8" height="12" rx="2" fill="#1a2622"/><rect x="-3" y="-17" width="6" height="5" rx="1" fill="#c8dbd1"/></g><g id="mirror-handlebar"><rect x="208" y="96" width="20" height="4" rx="1" fill="#ffc66d"/></g></g><text x="246" y="62" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ffc66d" text-anchor="start">MÔ TÔ ĐỖ</text><path d="M246 66L224 90" stroke="#ffc66d" stroke-width="1" stroke-linecap="round"/><g id="mirror-gap-left"><path d="M90 98L122 98" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M90 94L90 102" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><path d="M122 94L122 102" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><text x="106" y="91" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">a</text></g><g id="mirror-gap-right"><path d="M174 98L208 98" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M174 94L174 102" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><path d="M208 94L208 102" stroke="#b7f36b" stroke-width="1.6" stroke-linecap="round"/><text x="191" y="91" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#b7f36b" text-anchor="middle">b</text></g><text x="14" y="28" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">TƯỜNG</text><text x="246" y="28" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">TƯỜNG</text><text x="14" y="136" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">GƯƠNG MỞ</text><path d="M78 132L123 102" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><rect x="0" y="170" width="320" height="30" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="181" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. a, b: khoảng hở, không phải số</text><text x="16" y="193" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">đo.</text></svg>
