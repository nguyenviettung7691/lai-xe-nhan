<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ không theo tỷ lệ trên nền bằng: xe bạn màu xanh hướng lên, xe đối diện hướng xuống, cả hai dừng; chỗ tránh mở về phía trước bên phải xe bạn. Không vẽ quỹ đạo đánh lái.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><g id="yield-road"><rect x="126" y="0" width="64" height="174" rx="0" fill="#2c403a"/></g><g id="yield-pocket"><rect x="190" y="70" width="80" height="88" rx="0" fill="#2c403a"/></g><g id="yield-walls"><path d="M126 0L126 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M190 0L190 70" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M190 158L190 174" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M190 70L270 70" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M270 70L270 158" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M270 158L190 158" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="yield-ego" transform="translate(164 148) rotate(0)"><g transform="translate(0 0) rotate(0)"><rect x="-15" y="-24" width="30" height="48" rx="6" fill="#b7f36b"/><rect x="-11" y="-18" width="22" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="11" width="22" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><g id="yield-ego-mirrors"><rect x="-19" y="-13" width="4" height="4" rx="1" fill="#b7f36b"/><rect x="15" y="-13" width="4" height="4" rx="1" fill="#b7f36b"/></g></g><g id="yield-other" transform="translate(152 36) rotate(180)"><g transform="translate(0 0) rotate(0)"><rect x="-15" y="-24" width="30" height="48" rx="6" fill="#7e978c"/><rect x="-11" y="-18" width="22" height="9.6" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="11" width="22" height="7.7" rx="2" fill="#0e1715" opacity=".25"/></g><g id="yield-other-mirrors"><rect x="-19" y="-13" width="4" height="4" rx="1" fill="#7e978c"/><rect x="15" y="-13" width="4" height="4" rx="1" fill="#7e978c"/></g></g><text x="204" y="62" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">CHỖ TRÁNH</text><text x="12" y="24" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">XE ĐỐI DIỆN</text><text x="184" y="128" font-family="DM Mono, ui-monospace, monospace" font-size="7" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><text x="202" y="94" font-family="DM Mono, ui-monospace, monospace" font-size="7" font-weight="500" fill="#a9bcb3" text-anchor="start">PHÍA TRƯỚC</text><text x="202" y="108" font-family="DM Mono, ui-monospace, monospace" font-size="7" font-weight="500" fill="#a9bcb3" text-anchor="start">BÊN PHẢI</text><text x="12" y="82" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">CẢ HAI DỪNG</text><text x="12" y="96" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">ĐỂ KIỂM TRA</text><text x="12" y="148" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">XE BẠN DỪNG</text><path d="M90 145L141 148" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Chỗ tránh phía trước; chỉ tiến</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">vào khi được phép và đủ khoảng hở.</text></svg>
