<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ không theo tỷ lệ, đầu các xe hướng lên, lề phải ở bên phải hình; xe mình bên trái xe trước, hai đuôi ngang nhau chỉ là ví dụ. Mũi tên cong từ sau đuôi xe chỉ hướng lùi ban đầu xuống và sang phải về lề; đầu xe quét trái. Mũi tên thẳng bên trái chỉ chiều đi, không phải hướng lùi.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#2c403a"/><rect x="246" y="0" width="74" height="174" rx="0" fill="#1a2622"/><g id="parallel-curb"><path d="M246 0L246 174" stroke="#c8dbd1" stroke-width="2.4" stroke-linecap="round"/></g><g id="parallel-front"><g transform="translate(226 44) rotate(0)"><rect x="-12" y="-22" width="24" height="44" rx="6" fill="#7e978c"/><rect x="-8" y="-16" width="16" height="8.8" rx="2" fill="#0e1715" opacity=".45"/><rect x="-8" y="9" width="16" height="7" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="parallel-rear"><g transform="translate(226 144) rotate(0)"><rect x="-12" y="-22" width="24" height="44" rx="6" fill="#7e978c"/><rect x="-8" y="-16" width="16" height="8.8" rx="2" fill="#0e1715" opacity=".45"/><rect x="-8" y="9" width="16" height="7" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="260" y="88" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="start">LỀ</text><text x="260" y="102" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="start">PHẢI</text><g id="parallel-traffic"><path d="M44 146L44 120" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><text x="16" y="160" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">CHIỀU ĐI</text><g id="parallel-car"><g transform="translate(166 44) rotate(0)"><rect x="-12" y="-22" width="24" height="44" rx="6" fill="#b7f36b"/><rect x="-8" y="-16" width="16" height="8.8" rx="2" fill="#0e1715" opacity=".45"/><rect x="-8" y="9" width="16" height="7" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="166" y="15" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">ĐẦU</text><text x="146" y="65" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="end">ĐUÔI</text><g id="parallel-alignment"><path d="M178 66L214 66" stroke="#8ba79c" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/></g><text x="16" y="27" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ff8a6b" text-anchor="start">ĐẦU QUÉT TRÁI</text><path d="M100 29L148 36" stroke="#ff8a6b" stroke-width="1" stroke-linecap="round"/><text x="16" y="97" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">HƯỚNG ĐUÔI LÙI</text><path d="M112 94L167 87" stroke="#8ba79c" stroke-width="1" stroke-linecap="round"/><g id="parallel-reverse"><path d="M166 70C166 82 183 94 198 104" fill="none" stroke="#b7f36b" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#tip)"/></g><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ; chỉ hướng lùi ban đầu, không</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">phải toàn quỹ đạo hay mốc lái chung.</text></svg>
