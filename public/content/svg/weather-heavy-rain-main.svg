<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn ngang, không theo tỷ lệ: xe mình bên trái, xe trước bên phải, cả hai hướng đầu sang phải, bánh tiếp xúc mặt đường. Mũi tên phía trên chỉ chiều đi; ngoặc nét đứt đo khoảng trống từ đầu xe mình tới đuôi xe trước, không phải mũi tên tăng tốc hay quãng phanh bảo đảm. Đèn nhạt ở đầu và đỏ ở đuôi chỉ vị trí đèn, không phải phạm vi chiếu sáng.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><text x="160" y="18" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="700" fill="#b7f36b" text-anchor="middle">GIÃN CỰ LY THEO ĐIỀU KIỆN</text><g id="rain-direction"><text x="226" y="44" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="end">CHIỀU ĐI</text><path d="M240 41L286 41" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><g id="rain-road"><rect x="12" y="132" width="296" height="36" rx="0" fill="#2c403a"/><path d="M12 132L308 132" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="rain-ego"><g transform="translate(60 116) rotate(0)"><rect x="-27" y="-11" width="54" height="22" rx="7" fill="#b7f36b"/><rect x="-15" y="-18" width="27" height="9" rx="4" fill="#b7f36b" opacity=".8"/><circle cx="-15" cy="11" r="5" fill="#0e1715" opacity=".55"/><circle cx="15" cy="11" r="5" fill="#0e1715" opacity=".55"/></g></g><g id="rain-lead"><g transform="translate(242 116) rotate(0)"><rect x="-27" y="-11" width="54" height="22" rx="7" fill="#7e978c"/><rect x="-15" y="-18" width="27" height="9" rx="4" fill="#7e978c" opacity=".8"/><circle cx="-15" cy="11" r="5" fill="#0e1715" opacity=".55"/><circle cx="15" cy="11" r="5" fill="#0e1715" opacity=".55"/></g></g><g id="rain-lamps"><rect x="84" y="110" width="3" height="5" rx="1" fill="#fff3b0"/><rect x="33" y="110" width="3" height="5" rx="1" fill="#ff8a6b"/><rect x="266" y="110" width="3" height="5" rx="1" fill="#fff3b0"/><rect x="215" y="110" width="3" height="5" rx="1" fill="#ff8a6b"/></g><g id="rain-following-gap"><path d="M87 87L215 87" stroke="#b7f36b" stroke-width="1.8" stroke-dasharray="4 3" stroke-linecap="round"/><path d="M87 81L87 93" stroke="#b7f36b" stroke-width="1.8" stroke-linecap="round"/><path d="M215 81L215 93" stroke="#b7f36b" stroke-width="1.8" stroke-linecap="round"/><text x="151" y="73" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="middle">CỰ LY GIỮA HAI XE</text></g><text x="87" y="101" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><text x="269" y="101" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">ĐẦU</text><text x="60" y="153" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="middle">XE MÌNH</text><text x="242" y="153" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">XE TRƯỚC</text><rect x="0" y="170" width="320" height="30" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="181" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ; cự ly không là quãng phanh bảo</text><text x="16" y="193" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">đảm.</text></svg>
