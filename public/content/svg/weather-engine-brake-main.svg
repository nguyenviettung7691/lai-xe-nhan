<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ cắt ngang: vị trí lẫy số dùng để hãm tốc bằng động cơ.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="180" rx="0" fill="#1d2a26"/><path d="M0 70L120 70L300 150L320 150L320 180L0 180Z" fill="#2c403a"/><path d="M0 70L120 70L300 150L320 150" stroke="#c8dbd1" stroke-width="2.4" fill="none"/><g transform="translate(190 98) rotate(24)"><rect x="-27" y="-11" width="54" height="22" rx="7" fill="#b7f36b"/><rect x="-15" y="-18" width="27" height="9" rx="4" fill="#b7f36b" opacity=".8"/><circle cx="-15" cy="11" r="5" fill="#0e1715" opacity=".55"/><circle cx="15" cy="11" r="5" fill="#0e1715" opacity=".55"/></g><rect x="212" y="24" width="92" height="36" rx="6" fill="#25352f"/><text x="258" y="40" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="middle">LẪY SỐ</text><text x="258" y="53" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="middle">− giảm số</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Kéo lẫy trừ để về số thấp, vòng tua tăng là</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">đúng.</text></svg>
