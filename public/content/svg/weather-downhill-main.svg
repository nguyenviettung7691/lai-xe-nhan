<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn ngang, không theo tỷ lệ: phía cao bên trái, thấp bên phải; đầu xe có đèn ở bên phải, đuôi bên trái, hai bánh tiếp xúc mặt dốc. Mũi tên xanh phía trước xe đi sang phải và xuống, song song mặt đường, chỉ chiều tiến xuống dốc, không phải quỹ đạo hay độ dốc đo được. Giảm tốc trước dốc, dùng chế độ theo sách xe và giới hạn trên đường trơn; không có cấp số chung cho mọi xe.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><text x="16" y="18" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="start">CHỌN CHẾ ĐỘ THEO SÁCH XE</text><g id="downhill-grade"><path d="M32 60L292 164L292 174L32 174Z" fill="#2c403a"/><path d="M32 60L292 164" stroke="#c8dbd1" stroke-width="2.4" stroke-linecap="round"/></g><g id="downhill-car" transform="translate(133.9 83.5) rotate(21.8)"><rect x="-27" y="-11" width="54" height="22" rx="7" fill="#b7f36b"/><path d="M-15 -10L-10 -20L9 -20L19 -10Z" fill="#b7f36b"/><path d="M2 -18L8 -18L14 -11L2 -11Z" fill="#0e1715" opacity=".55"/><rect x="22" y="-6" width="4" height="4" rx="1" fill="#ffc66d"/><circle cx="-15" cy="11" r="5" fill="#0e1715"/><circle cx="15" cy="11" r="5" fill="#0e1715"/></g><text x="24" y="49" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">CAO</text><text x="276" y="151" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="middle">THẤP</text><text x="73" y="75" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐUÔI</text><path d="M98 76L109 80" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><text x="163" y="54" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><path d="M174 58L158 86" stroke="#b7f36b" stroke-width="1" stroke-linecap="round"/><g id="downhill-forward"><path d="M180 90L245 116" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><text x="232" y="85" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">ĐI XUỐNG</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Theo sách xe; đường trơn có</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">hạn chế.</text></svg>
