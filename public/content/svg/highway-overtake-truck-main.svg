<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống, không theo tỷ lệ: hai làn cùng chiều sang phải, xe tải có ca-bin ở đầu bên phải nằm trọn làn phải. Xe mình màu xanh ở sau xe tải; mũi tên từ đầu xe chuyển qua vạch đứt sang làn trái rồi đi thẳng. Vùng cam trước, sau và hai bên xe tải chỉ minh họa điểm mù thay đổi theo xe và gương, không phải ranh giới chính xác hoặc vùng ngoài đó chắc chắn được nhìn thấy. Chỉ đi khi được phép, đủ hở và không vượt giới hạn tốc độ; đường vẽ không phải quỹ đạo lái chính xác.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#1a2622"/><g id="overtake-road"><rect x="0" y="42" width="320" height="108" rx="0" fill="#2c403a"/></g><g id="overtake-edges"><path d="M0 42L320 42" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M0 150L320 150" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/></g><g id="overtake-divider"><path d="M0 96L320 96" stroke="#c8dbd1" stroke-width="1.8" stroke-dasharray="10 8" stroke-linecap="round"/></g><text x="16" y="18" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="start">ĐỦ ĐIỀU KIỆN MỚI QUA TRÁI</text><text x="16" y="34" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">HAI LÀN CÙNG CHIỀU</text><g id="overtake-direction"><path d="M260 29L300 29" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/><path d="M260 139L300 139" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><text x="300" y="57" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="end">LÀN TRÁI</text><text x="300" y="111" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="end">LÀN PHẢI</text><g id="overtake-blind-areas" opacity=".3"><rect x="84" y="111" width="24" height="24" rx="2" fill="#ff8a6b"/><rect x="184" y="111" width="26" height="24" rx="2" fill="#ff8a6b"/><rect x="111" y="60" width="70" height="48" rx="2" fill="#ff8a6b"/><rect x="111" y="138" width="70" height="8" rx="2" fill="#ff8a6b"/></g><g id="overtake-truck"><g transform="translate(146 123) rotate(90)"><rect x="-12" y="-35" width="24" height="15" rx="3" fill="#7e978c"/><rect x="-8" y="-32" width="16" height="3" rx="0" fill="#0e1715"/><rect x="-12" y="-17" width="24" height="52" rx="2" fill="#5f7a70"/></g></g><text x="146" y="126" font-family="DM Mono, ui-monospace, monospace" font-size="7" font-weight="500" fill="#e3ede7" text-anchor="middle">XE TẢI</text><g id="overtake-ego"><g transform="translate(36 123) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#b7f36b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><text x="36" y="106" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">XE MÌNH</text><g id="overtake-left-path"><path d="M52 123C78 123 82 69 108 69L232 69" fill="none" stroke="#b7f36b" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#tip)"/></g><rect x="16" y="155" width="9" height="9" rx="1" fill="#ff8a6b" opacity="0.5"/><text x="31" y="163" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">ĐIỂM MÙ MINH HỌA, KHÔNG CỐ ĐỊNH</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ. Đủ hở mới đổi làn; không vượt</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">giới hạn tốc độ để qua xe tải.</text></svg>
