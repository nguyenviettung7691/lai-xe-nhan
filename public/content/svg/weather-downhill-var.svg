<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ hai khung chữ, không phải biểu đồ thời gian, lực phanh hay chu kỳ đạp nhả: khung trên mô tả phanh thường tăng lực êm khi cần, nhả khi đã giảm đủ và vẫn kiểm soát tốc độ; không rà suốt dốc hoặc nhấp theo nhịp. Khung dưới mô tả khẩn cấp với ABS: đạp mạnh, giữ lực, không nhấp nhả, lái tránh trong khoảng trống an toàn; ABS không bảo đảm dừng ngắn hơn.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><text x="16" y="16" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#b7f36b" text-anchor="start">HAI TÌNH HUỐNG PHANH</text><g id="downhill-normal-braking"><rect x="12" y="24" width="296" height="65" rx="6" fill="#2c403a"/><text x="22" y="39" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#b7f36b" text-anchor="start">ĐI THƯỜNG: GIẢM TỐC KHI CẦN</text><text x="22" y="54" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">Tăng lực êm; nhả khi đã giảm đủ</text><text x="22" y="67" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">và vẫn kiểm soát được tốc độ.</text><text x="22" y="80" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">Không rà suốt dốc, không nhấp theo nhịp.</text></g><g id="downhill-abs-emergency"><rect x="12" y="98" width="296" height="65" rx="6" fill="#2c403a"/><text x="22" y="113" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#ff8a6b" text-anchor="start">KHẨN CẤP VỚI ABS</text><text x="22" y="128" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">Đạp mạnh, giữ lực; không nhấp nhả.</text><text x="22" y="141" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">Lái tránh trong khoảng trống an toàn.</text><text x="22" y="154" font-family="DM Mono, ui-monospace, monospace" font-size="8.5" font-weight="500" fill="#a9bcb3" text-anchor="start">ABS không bảo đảm dừng ngắn hơn.</text></g><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Phân biệt tình huống, không phải biểu đồ nhịp</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">phanh.</text></svg>
