<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ nhìn từ trên xuống: đầu xe ở dưới, đuôi ở trên; nét đứt từ hai gương hướng về vạch phía sau chỉ minh họa hướng nhìn, không mô tả đầy đủ vùng thấy hay thay thế quan sát trực tiếp.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#2c403a"/><rect x="120" y="24" width="80" height="110" rx="0" fill="#31463f"/><g id="alignment-bay"><path d="M120 24L120 134" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M200 24L200 134" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M120 24L200 24" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/></g><g transform="translate(64 81) rotate(180)"><rect x="-20" y="-36" width="40" height="72" rx="6" fill="#7e978c"/><rect x="-16" y="-30" width="32" height="14.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-16" y="23" width="32" height="11.5" rx="2" fill="#0e1715" opacity=".25"/></g><g transform="translate(256 81) rotate(180)"><rect x="-20" y="-36" width="40" height="72" rx="6" fill="#7e978c"/><rect x="-16" y="-30" width="32" height="14.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-16" y="23" width="32" height="11.5" rx="2" fill="#0e1715" opacity=".25"/></g><g id="alignment-car"><g transform="translate(160 81) rotate(180)"><rect x="-20" y="-36" width="40" height="72" rx="6" fill="#b7f36b"/><rect x="-16" y="-30" width="32" height="14.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-16" y="23" width="32" height="11.5" rx="2" fill="#0e1715" opacity=".25"/></g></g><rect x="135" y="102" width="5" height="4" rx="1" fill="#b7f36b"/><rect x="180" y="102" width="5" height="4" rx="1" fill="#b7f36b"/><text x="160" y="38" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">ĐUÔI</text><text x="160" y="130" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">ĐẦU</text><text x="160" y="13" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">GƯƠNG CHỈ HỖ TRỢ</text><g id="mirror-sightlines"><path d="M137.5 104L120 50" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/><path d="M182.5 104L200 50" stroke="#b7f36b" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/></g><text x="160" y="153" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">Kết hợp quan sát trực tiếp quanh xe</text><rect x="0" y="184" width="320" height="16" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Nét đứt: hướng nhìn minh họa, không là quỹ đạo.</text></svg>
