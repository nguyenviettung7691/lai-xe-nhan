<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ cắt ngang: xe tấp vào lề và bật đèn cảnh báo khi mưa quá lớn.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="180" rx="0" fill="#1b2b34"/><rect x="0" y="118" width="320" height="62" rx="0" fill="#2c403a"/><rect x="0" y="150" width="320" height="30" rx="0" fill="#1a2622"/><g transform="translate(220 138) rotate(0)"><rect x="-27" y="-11" width="54" height="22" rx="7" fill="#b7f36b"/><rect x="-15" y="-18" width="27" height="9" rx="4" fill="#b7f36b" opacity=".8"/><circle cx="-15" cy="11" r="5" fill="#0e1715" opacity=".55"/><circle cx="15" cy="11" r="5" fill="#0e1715" opacity=".55"/></g><g fill="#ff8a6b"><circle cx="196" cy="126" r="4"/><circle cx="244" cy="126" r="4"/></g><text x="16" y="172" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="start">Đỗ sát lề an toàn · bật đèn cảnh báo</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Mưa quá lớn thì tấp vào nơi được phép dừng và</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">bật đèn khẩn.</text></svg>
