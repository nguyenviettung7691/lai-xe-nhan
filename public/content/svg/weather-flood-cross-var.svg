<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Hai bảng điều kiện, không là bản đồ hay quy trình thoát mọi xe chìm: có lối khô an toàn thì ra nơi cao; kẹt giữa dòng xiết không có lối an toàn thì ở trong xe gọi cứu nạn, nước dâng vào xe thì tìm cách lên nóc ra hiệu, không nhảy xuống dòng chảy. Không đề lại hay bật READY.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><text x="160" y="17" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="700" fill="#b7f36b" text-anchor="middle">XE KẸT: ƯU TIÊN NGƯỜI, GỌI CỨU NẠN</text><g id="flood-safe-exit"><rect x="12" y="28" width="296" height="58" rx="6" fill="#2c403a"/><text x="22" y="43" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="700" fill="#b7f36b" text-anchor="start">CÓ LỐI THOÁT KHÔ AN TOÀN</text><text x="22" y="60" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#a9bcb3" text-anchor="start">Ra nơi cao khô; không lội hoặc bơi qua nước.</text><text x="22" y="76" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#a9bcb3" text-anchor="start">Không quay lại lấy đồ; làm theo cứu nạn.</text></g><g id="flood-trapped-current"><rect x="12" y="94" width="296" height="74" rx="6" fill="#2c403a"/><text x="22" y="109" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="700" fill="#ff8a6b" text-anchor="start">KẸT GIỮA DÒNG XIẾT, KHÔNG LỐI AN TOÀN</text><text x="22" y="126" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#a9bcb3" text-anchor="start">Ở trong xe, gọi cứu nạn và báo vị trí.</text><text x="22" y="142" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#a9bcb3" text-anchor="start">Nước dâng vào xe: tìm cách lên nóc, ra hiệu.</text><text x="22" y="158" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#a9bcb3" text-anchor="start">Không nhảy xuống dòng chảy.</text></g><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không đề lại hoặc bật READY; không là sơ đồ lối</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">thoát.</text></svg>
