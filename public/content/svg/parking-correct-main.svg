<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Sơ đồ không theo tỷ lệ: xe đang dừng, thân nghiêng so với trục ô; đuôi ở trên, đầu hướng xuống lối đi qua cửa ô mở. Nét đứt là trục ô, không phải đường xe chạy; không có mũi tên chuyển động.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="174" rx="0" fill="#2c403a"/><rect x="120" y="24" width="80" height="88" rx="0" fill="#31463f"/><g id="correction-bay"><path d="M120 24L120 112" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M200 24L200 112" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/><path d="M120 24L200 24" stroke="#c8dbd1" stroke-width="1.6" stroke-linecap="round"/></g><g id="correction-axis"><path d="M160 32L160 104" stroke="#8ba79c" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/></g><text x="108" y="39" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="end">TRỤC Ô</text><path d="M110 36L160 36" stroke="#8ba79c" stroke-width="1" stroke-linecap="round"/><g transform="translate(64 70) rotate(180)"><rect x="-15" y="-26" width="30" height="52" rx="6" fill="#7e978c"/><rect x="-11" y="-20" width="22" height="10.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="13" width="22" height="8.3" rx="2" fill="#0e1715" opacity=".25"/></g><g transform="translate(256 70) rotate(180)"><rect x="-15" y="-26" width="30" height="52" rx="6" fill="#7e978c"/><rect x="-11" y="-20" width="22" height="10.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="13" width="22" height="8.3" rx="2" fill="#0e1715" opacity=".25"/></g><g id="correction-car"><g transform="translate(156 86) rotate(160)"><rect x="-15" y="-26" width="30" height="52" rx="6" fill="#b7f36b"/><rect x="-11" y="-20" width="22" height="10.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-11" y="13" width="22" height="8.3" rx="2" fill="#0e1715" opacity=".25"/></g><g transform="translate(156 86) rotate(160)"><rect x="-19" y="-14" width="4" height="3" rx="1" fill="#b7f36b"/><rect x="15" y="-14" width="4" height="3" rx="1" fill="#b7f36b"/></g></g><text x="143" y="49" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">ĐUÔI</text><text x="190" y="128" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="start">ĐẦU</text><text x="20" y="153" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="start">LỐI ĐI</text><text x="160" y="13" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">DỪNG ĐỂ ĐÁNH GIÁ</text><text x="306" y="153" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#a9bcb3" text-anchor="end">Thân nghiêng so với vạch</text><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ; chưa rõ khoảng trống thì giữ</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">phanh.</text></svg>
