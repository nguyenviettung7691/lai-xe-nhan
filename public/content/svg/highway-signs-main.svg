<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="ttl"><title id="ttl">Bảng nhận diện minh họa, không theo tỷ lệ hay mô tả cách đặt biển: vòng đỏ nền trắng số đen 80 là tối đa 80 km/h; vòng xanh lam số trắng 60 là tối thiểu 60 km/h khi giao thông thuận lợi và an toàn. Gặp nguy hiểm cần giảm tốc, kể cả dưới mức tối thiểu. Phía dưới là xe hướng đầu sang phải và mũi tên đi thẳng trên mặt đường, không phải quỹ đạo chuyển làn.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7f36b"/></marker></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="#22332e"/><rect x="0" y="0" width="320" height="180" rx="0" fill="#1a2622"/><text x="160" y="14" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">NHẬN DIỆN BIỂN (VÍ DỤ)</text><g id="signs-maximum"><circle cx="80" cy="42" r="18" fill="#fff"/><circle cx="80" cy="42" r="16" fill="none" stroke="#d22" stroke-width="3"/><text x="80" y="47" font-family="DM Mono, ui-monospace, monospace" font-size="15" font-weight="700" fill="#111" text-anchor="middle">80</text></g><g id="signs-minimum"><circle cx="240" cy="42" r="18" fill="#1956aa"/><text x="240" y="47" font-family="DM Mono, ui-monospace, monospace" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">60</text></g><text x="80" y="78" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">TỐI ĐA 80 km/h</text><text x="240" y="78" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#a9bcb3" text-anchor="middle">TỐI THIỂU 60 km/h</text><text x="80" y="94" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">KHÔNG VƯỢT SỐ</text><text x="240" y="94" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#b7f36b" text-anchor="middle">KHI THUẬN LỢI, AN TOÀN</text><text x="160" y="113" font-family="DM Mono, ui-monospace, monospace" font-size="8" font-weight="500" fill="#ffc66d" text-anchor="middle">GẶP NGUY: GIẢM TỐC, KHÔNG ÉP TỐI THIỂU</text><g id="signs-road"><rect x="0" y="124" width="320" height="42" rx="0" fill="#2c403a"/></g><path d="M0 124L320 124" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><path d="M0 166L320 166" stroke="#c8dbd1" stroke-width="2" stroke-linecap="round"/><g id="signs-car"><g transform="translate(52 145) rotate(90)"><rect x="-9" y="-16" width="18" height="32" rx="6" fill="#b7f36b"/><rect x="-5" y="-10" width="10" height="6.4" rx="2" fill="#0e1715" opacity=".45"/><rect x="-5" y="3" width="10" height="5.1" rx="2" fill="#0e1715" opacity=".25"/></g></g><g id="signs-travel"><path d="M70 145L292 145" fill="none" stroke="#b7f36b" stroke-width="1.8" marker-end="url(#tip)"/></g><rect x="0" y="174" width="320" height="26" rx="0" fill="#1a2622" opacity="0.92"/><text x="16" y="185" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">Không theo tỷ lệ; bảng nhận diện, không mô tả</text><text x="16" y="195" font-family="DM Mono, ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#a9bcb3" text-anchor="start">cách đặt biển. Đủ hở mới đổi làn.</text></svg>
